kotlin.compiler.plugin.devkit.minCliVersion=2.2.20
kotlin.compiler.plugin.devkit.includeBetaAndRc=all
kotlin.compiler.plugin.devkit.minIdeaVersion=252
kotlin.compiler.plugin.devkit.includeIdeaRc=true
kotlin.compiler.plugin.devkit.includeIdeaEap=true
# The newest `dev` build as of the last push. Each pushed commit gets a uniquely named release,
# and the pin makes that release the one that supports this version (#65).
kotlin.compiler.plugin.devkit.pinnedDevVersion=2.5.20-dev-4555
# Useful for development
kotlin.compiler.plugin.devkit.useLatestDev=true
kotlin.compiler.plugin.devkit.useLatestBootstrap=true
# The default heap of 512 MiB is too small for this build: it compiles the sources for every registered version.
org.gradle.jvmargs=-Xmx4g
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.caching=true
org.gradle.configuration-cache=true
#org.gradle.unsafe.isolated-projects=true
