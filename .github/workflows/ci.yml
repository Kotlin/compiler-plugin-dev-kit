name: CI

defaults:
  run:
    working-directory: metro

on:
  # Only run push on main
  push:
    paths-ignore:
      - '**/*.md'
  # Always run on PRs
  pull_request:

concurrency:
  group: 'ci-${{ github.event.merge_group.head_ref || github.head_ref }}-${{ github.workflow }}'
  cancel-in-progress: ${{ github.ref != 'refs/heads/template-refactoring-poc' }}

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Configure JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.java-version

      - name: Cache kempt formatter binaries
        uses: actions/cache@v6
        with:
          path: ~/.kempt/cache
          key: kempt-${{ hashFiles('.kempt.toml') }}

      - name: Install kempt
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/ZacSweers/kempt/releases/latest/download/kempt-fmt-installer.sh | sh

      - name: Pre-warm kempt cache
        run: kempt update

      - name: Check formatting
        run: kempt check

  generate-matrix:
    name: "⊹ generate compiler matrix ⊹"
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Generate matrix
        id: generate
        run: ./scripts/generate-ci-matrix.sh

  core:
    name: "core artifacts / ${{ matrix.kotlin-compiler }}"
    runs-on: ubuntu-latest
    needs: generate-matrix
    timeout-minutes: 40
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/template-refactoring-poc' }}
          konan: true
          kotlin-compiler-version: ${{ matrix.kotlin-compiler }}

      - name: Check root project
        run: |
          echo "Running checks..."
          # metro.functionalTestKmpTarget=jvm scopes IC test parameterization to JVM only here. The
          # kmp-functional job (main only) fans the remaining targets out into parallel runners.
          ./gradlew check --continue '-Pmetro.testCompilerVersion=${{ matrix.kotlin-compiler }}' -Pmetro.excludeJsBoxTests -Pmetro.functionalTestKmpTarget=jvm ${{ github.ref != 'refs/heads/template-refactoring-poc' && '-Dorg.gradle.configuration-cache.read-only=true' || '' }}

      - name: (Fail-only) Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-core-${{ matrix.kotlin-compiler }}
          path: |
            **/build/reports/**

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: failure()
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: 'Test Report - core / ${{ matrix.kotlin-compiler }}'

  js-box:
    name: ${{ format('js box / {0}', github.ref == 'refs/heads/template-refactoring-poc' && 'full' || 'smoke') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/template-refactoring-poc' }}

      - name: Run JS box smoke tests
        if: github.ref != 'refs/heads/template-refactoring-poc'
        run: |
          ./gradlew :compiler-tests:test \
            --tests 'dev.zacsweers.metro.compiler.JsBoxTestGenerated$Inject$Assisted.testBasicAssistedInject' \
            --tests 'dev.zacsweers.metro.compiler.JsBoxTestGenerated$Multibindings.testMapProviderLazyValues' \
            ${{ github.ref != 'refs/heads/template-refactoring-poc' && '-Dorg.gradle.configuration-cache.read-only=true' || '' }}

      - name: Run JS box tests
        if: github.ref == 'refs/heads/template-refactoring-poc'
        run: |
          ./gradlew :compiler-tests:test --continue -Pmetro.jsBoxTestRetries=3 \
            --tests 'dev.zacsweers.metro.compiler.JsBoxTestGenerated*' \
            --tests 'dev.zacsweers.metro.compiler.JsFastInitBoxTestGenerated*' \
            --tests 'dev.zacsweers.metro.compiler.JsContributionProvidersBoxTestGenerated*'

      - name: (Fail-only) Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-js-box
          path: |
            **/build/reports/**

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: failure()
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: 'Test Report - js box'

  # Main-only: run each non-JVM target of :gradle-plugin:functionalTest in its own runner so
  # the slow IC test classes (BindingContainerICTests, ICTests, GenerateContributionProvidersICTests)
  # parallelize across targets instead of serializing inside one job. PR/branch runs stay JVM-only
  # via the `core` job above.
  kmp-functional:
    name: ${{ format('kmp functional / {0}{1}', matrix.target, github.ref != 'refs/heads/template-refactoring-poc' && ' (skipped)' || '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        target: [ js, wasmJs, linuxX64 ]

    steps:
      - name: Skip on PRs
        if: github.ref != 'refs/heads/template-refactoring-poc'
        working-directory: ${{ github.workspace }}
        run: echo "Skipping kmp functional tests on PRs to reduce CI time"

      - name: Checkout
        if: github.ref == 'refs/heads/template-refactoring-poc'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Gradle
        if: github.ref == 'refs/heads/template-refactoring-poc'
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/template-refactoring-poc' }}
          konan: true
          # All 3 matrix targets here run against the default Kotlin version (from libs.versions.toml)
          # so they share the same `<os>-konan-klibs-default` cache key. Only the linuxX64 target
          # actually populates `~/.konan/kotlin-native-prebuilt-linux-*/`; the js and wasmJs entries
          # don't touch ~/.konan/ but cleanly read whatever the linuxX64 entry saved.

      - name: ':gradle-plugin:functionalTest'
        if: github.ref == 'refs/heads/template-refactoring-poc'
        run: ./gradlew :gradle-plugin:functionalTest --continue -Pmetro.functionalTestKmpTarget=${{ matrix.target }}

      - name: (Fail-only) Upload reports
        if: failure() && github.ref == 'refs/heads/template-refactoring-poc'
        uses: actions/upload-artifact@v7
        with:
          name: reports-kmp-functional-${{ matrix.target }}
          path: |
            **/build/reports/**

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: failure() && github.ref == 'refs/heads/template-refactoring-poc'
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: 'Test Report - kmp functional / ${{ matrix.target }}'

  samples:
    name: samples
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/template-refactoring-poc' }}
          konan: true

      - name: Check samples
        run: |
          # We have to regen package locks because the kotlin yarn/node/etc build tooling is brittle
          ./gradlew -p samples kotlinWasmUpgradePackageLock kotlinUpgradePackageLock --rerun-tasks --no-build-cache --no-configuration-cache --quiet ${{ github.ref != 'refs/heads/template-refactoring-poc' && '-Dorg.gradle.configuration-cache.read-only=true' || '' }}
          ./gradlew -p samples check --continue --quiet ${{ github.ref != 'refs/heads/template-refactoring-poc' && '-Dorg.gradle.configuration-cache.read-only=true' || '' }}

      - name: (Fail-only) Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-samples
          path: |
            **/build/reports/**

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: failure()
        with:
          report_paths: 'samples/**/build/test-results/**/TEST-*.xml'
          check_name: 'Test Report - samples'

  idea-plugin:
    name: idea-plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/template-refactoring-poc' }}

      - name: Test idea-plugin
        run: ./gradlew -p idea-plugin test --quiet ${{ github.ref != 'refs/heads/template-refactoring-poc' && '-Dorg.gradle.configuration-cache.read-only=true' || '' }}

      - name: (Fail-only) Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-idea-plugin
          path: |
            **/build/reports/**

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: failure()
        with:
          report_paths: 'idea-plugin/**/build/test-results/**/TEST-*.xml'
          check_name: 'Test Report - idea-plugin'

  # Run multiplatform tests on main only to reduce PR time
  # Note: We use step-level conditions instead of job-level to ensure matrix expands and shows nice names
  multiplatform-tests:
    name: ${{ format('multiplatform / {0}{1}', matrix.os, github.ref != 'refs/heads/template-refactoring-poc' && ' (skipped)' || '') }}
    runs-on: ${{ github.ref == 'refs/heads/template-refactoring-poc' && matrix.os || 'ubuntu-latest' }}
    permissions:
      contents: read
      checks: write
    # Windows runners default to PowerShell, which mis-parses gradle `-Pkey.with.dots=value` args
    # (splits on the dot). Forcing bash everywhere keeps `./gradlew … -P…` consistent across OSes;
    # Git Bash ships with the Windows runner image.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Skip on PRs
        if: github.ref != 'refs/heads/template-refactoring-poc'
        working-directory: ${{ github.workspace }}
        run: echo "Skipping multiplatform tests on PRs to reduce CI time"

      - name: Checkout
        if: github.ref == 'refs/heads/template-refactoring-poc'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # https://github.com/gradle/actions/issues/1013
      - name: Setup Gradle
        if: github.ref == 'refs/heads/template-refactoring-poc'
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/template-refactoring-poc' }}
          konan: true

      - name: Check runtime and IC tests
        if: github.ref == 'refs/heads/template-refactoring-poc'
        # `all` exercises every KmpTarget entry on this OS — host native is OS-specific (macosArm64,
        # mingwX64, etc.), so each runner covers a different native target naturally.
        run: ./gradlew :runtime:allTests :gradle-plugin:functionalTest --continue --quiet -Pmetro.functionalTestKmpTarget=all

      - name: Check samples
        if: github.ref == 'refs/heads/template-refactoring-poc'
        run: ./gradlew -p samples test allTests --continue --quiet

      - name: (Fail-only) Upload reports
        if: failure() && github.ref == 'refs/heads/template-refactoring-poc'
        uses: actions/upload-artifact@v7
        with:
          name: reports-multiplatform-${{ matrix.os }}
          path: |
            **/build/reports/**

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: failure() && github.ref == 'refs/heads/template-refactoring-poc'
        with:
          report_paths: |
            **/build/test-results/**/TEST-*.xml
            samples/**/build/test-results/**/TEST-*.xml
          check_name: 'Test Report - multiplatform / ${{ matrix.os }}'

  benchmarks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/template-refactoring-poc' }}
          konan: true

      - name: Build Metro benchmark
        run: |
          cd benchmark
          ./run_benchmarks.sh metro --build-only

      - name: (Fail-only) Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-benchmarks
          path: |
            **/build/reports/**

  # https://jakewharton.com/fan-in-to-a-single-required-github-action/
  final-status:
    if: always()
    runs-on: ubuntu-slim
    needs:
      - format
      - core
      - js-box
      - kmp-functional
      - benchmarks
      - idea-plugin
      - samples
    steps:
      - name: Check
        working-directory: ${{ github.workspace }}
        run: |
          results=$(tr -d '\n' <<< '${{ toJSON(needs.*.result) }}')
          if ! grep -q -v -E '(failure|cancelled)' <<< "$results"; then
            echo "One or more required jobs failed"
            exit 1
          fi

  publish:
    name: Publish snapshot (main only)
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' && github.repository == 'zacsweers/metro'
    needs:
      - final-status

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/template-refactoring-poc' }}
          konan: true

      - name: Upload snapshot
        # Sonatype keeps giving 429 errors lately, so no need to mark this as failure for now
        continue-on-error: true
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SonatypeUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SonatypePassword }}
        run: ./metrow publish
