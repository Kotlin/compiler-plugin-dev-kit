name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Uploads are not cancelled halfway through: a version that is partly in the repository is worse
# than a queued run.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The runner has 16 GB, and the Kotlin daemon is a second JVM next to Gradle's.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvmargs=-Xmx4g
  ORG_GRADLE_PROJECT_devKitSpaceUsername: ${{ secrets.DEVKITSPACEUSERNAME }}
  ORG_GRADLE_PROJECT_devKitSpacePassword: ${{ secrets.DEVKITSPACEPASSWORD }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Writes the dependency and build caches, since `main` is the default branch - without them
      # every registered version's compiler is downloaded and compiled from scratch each run.
      - uses: gradle/actions/setup-gradle@v4

      - name: Check ref
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The published commit must be on origin/main; first-parent commit counts are only unique along main, so a side-branch build could mint a version that collides with a published one"
            exit 1
          fi

      - name: Compute version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base=$(sed -nE 's/^[[:space:]]*devkit-version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
            gradle/libs.versions.toml)
          if [ -z "$base" ]; then
            echo "::error file=gradle/libs.versions.toml::no devkit-version entry found"
            exit 1
          fi
          base=${base%-SNAPSHOT}
          if [[ ! $base =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error file=gradle/libs.versions.toml::devkit-version '$base' is not a plain" \
              "'<major>.<minor>.<patch>' version, optionally followed by '-SNAPSHOT'"
            exit 1
          fi
          n=$(git rev-list --count --first-parent "$GITHUB_SHA")
          if [[ $n -eq 1 && -n $(git show -s --format=%P "$GITHUB_SHA") ]]; then
            echo "::error::Only one commit is available, but '$GITHUB_SHA' has a parent; check that checkout fetched full history"
            exit 1
          fi
          echo "version=$base-dev-$n" >> "$GITHUB_OUTPUT"

      - name: Publish
        shell: bash
        env:
          # Overrides the catalog's `devkit-version` in all three builds; see their settings files.
          DEVKIT_PUBLISH_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The root build compiles the other two on the way, so it is the one that can still fail
          # after something has been uploaded. Publishing it first keeps a failed run from leaving
          # half a version behind.
          for build in . plugins version-resolution; do
            ./gradlew --project-dir "$build" publishAllPublicationsToDevKitSpaceRepository
          done

      - name: Release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already exists; leaving it as is"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
              --title "$VERSION" \
              --notes "Published \`$VERSION\` to <https://packages.jetbrains.team/maven/p/compiler-plugin-dev-kit/eap>."
          fi

      - name: Summarize
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "Published \`$VERSION\` to <https://packages.jetbrains.team/maven/p/compiler-plugin-dev-kit/eap>. [GitHub Release](https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION)." \
            >> "$GITHUB_STEP_SUMMARY"
