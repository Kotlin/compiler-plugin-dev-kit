[versions]
# The dev kit's own coordinates; the only place they exist, since all three builds read this file.
devkit-group = "org.jetbrains.kotlin.compiler.plugin.devkit"
devkit-version = "0.0.4-SNAPSHOT"
# https://github.com/JetBrains/kotlin
kotlin = "2.4.10"
animal-sniffer = "2.0.1"
buildconfig = "6.0.10"
gradle = "9.2.0"
ktfmt = "0.64"
node-gradle = "7.0.2"
plugin-publish = "2.2.1"
publish = "0.37.0"
spotless = "8.8.0"
tapmoc = "0.4.2"
testkit-plugin = "0.19"
testkit-support = "0.30"
testkit-truth = "1.7.1"
truth = "1.4.5"
diff-utils = "4.12"

[plugins]
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
tapmoc = { id = "com.gradleup.tapmoc", version.ref = "tapmoc" }
testkit = { id = "com.autonomousapps.testkit", version.ref = "testkit-plugin" }

[libraries]
animal-sniffer = { group = "ru.vyarus", name = "gradle-animalsniffer-plugin", version.ref = "animal-sniffer" }
buildconfig = { group = "com.github.gmazzo.buildconfig", name = "plugin", version.ref = "buildconfig" }
gradle-public-api = { group = "org.gradle.experimental", name = "gradle-public-api", version.ref = "gradle" }
maven-publish = { group = "com.vanniktech", name = "gradle-maven-publish-plugin", version.ref = "publish" }
node-gradle = { group = "com.github.node-gradle.node", name = "com.github.node-gradle.node.gradle.plugin", version.ref = "node-gradle" }
plugin-publish = { group = "com.gradle.publish", name = "plugin-publish-plugin", version.ref = "plugin-publish" }
testkit-plugin = { group = "com.autonomousapps", name = "gradle-testkit-plugin", version.ref = "testkit-plugin" }
testkit-support = { group = "com.autonomousapps", name = "gradle-testkit-support", version.ref = "testkit-support" }
testkit-truth = { group = "com.autonomousapps", name = "gradle-testkit-truth", version.ref = "testkit-truth" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
diff-utils = { module = "io.github.java-diff-utils:java-diff-utils", version.ref = "diff-utils" }