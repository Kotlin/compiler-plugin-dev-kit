[versions]
# The dev kit's own coordinates; the only place they exist, since all three builds read this file.
devkit-group = "org.jetbrains.kotlin.compiler.plugin.devkit"
devkit-version = "0.0.3-SNAPSHOT"
# https://github.com/JetBrains/kotlin
kotlin = "2.4.10"
animal-sniffer = "2.0.1"
buildconfig = "6.0.10"
gradle = "9.2.0"
# IDE Starter and the Driver SDK, used by `ide-test`. Their jars embed platform classes, so this
# version has to stay compatible with every IDE build a consumer tests against; see AGENTS.md.
ide-starter = "261.23567.138"
junit-jupiter = "6.1.2"
ktfmt = "0.64"
node-gradle = "7.0.2"
publish = "0.37.0"
spotless = "8.8.0"
tapmoc = "0.4.2"
testkit-plugin = "0.19"
testkit-support = "0.27"
testkit-truth = "1.7.1"
truth = "1.4.5"
diff-utils = "4.12"

[plugins]
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "publish" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
tapmoc = { id = "com.gradleup.tapmoc", version.ref = "tapmoc" }

[libraries]
animal-sniffer = { group = "ru.vyarus", name = "gradle-animalsniffer-plugin", version.ref = "animal-sniffer" }
buildconfig = { group = "com.github.gmazzo.buildconfig", name = "plugin", version.ref = "buildconfig" }
gradle-public-api = { group = "org.gradle.experimental", name = "gradle-public-api", version.ref = "gradle" }
ide-starter-squashed = { group = "com.jetbrains.intellij.tools", name = "ide-starter-squashed", version.ref = "ide-starter" }
ide-starter-junit5 = { group = "com.jetbrains.intellij.tools", name = "ide-starter-junit5", version.ref = "ide-starter" }
ide-starter-driver = { group = "com.jetbrains.intellij.tools", name = "ide-starter-driver", version.ref = "ide-starter" }
ide-driver-client = { group = "com.jetbrains.intellij.driver", name = "driver-client", version.ref = "ide-starter" }
ide-driver-sdk = { group = "com.jetbrains.intellij.driver", name = "driver-sdk", version.ref = "ide-starter" }
ide-driver-model = { group = "com.jetbrains.intellij.driver", name = "driver-model", version.ref = "ide-starter" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit-jupiter" }
node-gradle = { group = "com.github.node-gradle", name = "gradle-node-plugin", version.ref = "node-gradle" }
testkit-plugin = { group = "com.autonomousapps", name = "gradle-testkit-plugin", version.ref = "testkit-plugin" }
testkit-support = { group = "com.autonomousapps", name = "gradle-testkit-support", version.ref = "testkit-support" }
testkit-truth = { group = "com.autonomousapps", name = "gradle-testkit-truth", version.ref = "testkit-truth" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
diff-utils = { module = "io.github.java-diff-utils:java-diff-utils", version.ref = "diff-utils" }